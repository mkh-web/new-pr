            <h2>بيانات العيادة</h2>

          </div>

          <form>
            <div class="form-grid">
              <div class="field">
                <label>اسم العيادة</label>
                <input type="text" value="عيادة الرؤية المتقدمة" />
              </div>
              <div class="field">
                <label>المدينة</label>

              <div class="field">

              <div class="field">
                <label>رقم الهاتف</label>
                <input type="text" value="0559876543" />
              </div>
              <div class="field full">
                <label>العنوان</label>
                <input type="text" value="شارع الملك فهد، حي النخيل، المبنى رقم 12" />
              </div>
              <div class="field full">
                <label>وصف العيادة</label>

              </div>
            </div>

            <div class="form-actions">
              <button type="button" class="ghost-btn">إلغاء</button>
              <button type="button" class="primary-btn" data-toast="تم إضافة العيادة بنجاح">حفظ العيادة</button>
            </div>
          </form>
        </section>

    <div id="toast" class="toast" aria-live="polite"></div>

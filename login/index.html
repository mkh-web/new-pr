<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="assets/login.css" />
  </head>
  <body class="login-page">
    <div class="login-shell">
      <div class="login-card">
        <div class="brand-box">
          <div class="brand-mark">+</div>
          <div>
            <p class="eyebrow">Clinic Portal</p>
            <h1>تسجيل الدخول</h1>
          </div>
        </div>

        <form id="login-form" class="login-form">
          <label class="field-label" for="username">اسم المستخدم</label>
          <input id="username" name="username" type="text" placeholder="patient" autocomplete="off" />

          <button type="submit" class="login-btn">دخول</button>
        </form>

        <p class="helper-text"></p>
        <p id="login-error" class="login-error" aria-live="polite"></p>
      </div>
    </div>

    <script src="assets/login.js"></script>
  </body>
</html>

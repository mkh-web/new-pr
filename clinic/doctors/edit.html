<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تعديل طبيب</title>
    <link rel="stylesheet" href="../assets/clinic.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">+</div>
          <div>
            <small>Clinic Portal</small>
            <strong>إدارة العيادة</strong>
          </div>
        </div>

        <div class="side-group">
          <div class="side-label">إدارة العيادة</div>
          <a class="nav-link" href="../index.html"><span>لوحة التحكم</span><span class="count">01</span></a>
          <a class="nav-link" href="../reports/index.html"><span>التقارير والإحصاءات</span><span class="count">02</span></a>
          <a class="nav-link active" href="index.html"><span>إدارة الأطباء</span><span class="count">03</span></a>
          <a class="nav-link" href="../payments/index.html"><span>إدارة الدفع</span><span class="count">04</span></a>
          <a class="nav-link" href="../profile/index.html"><span>ملف العيادة</span><span class="count">05</span></a>
          <a class="nav-link" href="../bookings/index.html"><span>متابعة الحجوزات</span><span class="count">06</span></a>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p>إدارة الأطباء</p>
            <h1>تعديل طبيب</h1>
          </div>
          <div class="user-pill">
            <div class="user-avatar">ع</div>
            <div>
              <strong>عيادة النور</strong>
              <small>إدارة العيادة</small>
            </div>
          </div>
        </header>

        <section class="panel">
          <div class="panel-header">
            <h2>تحديث بيانات الطبيب</h2>
            <span class="badge success">نشط</span>
          </div>

          <form>
            <div class="form-grid">
              <div class="field">
                <label>الاسم الكامل</label>
                <input type="text" value="د. طيب محمد" />
              </div>
              <div class="field">
                <label>التخصص</label>
                <input type="text" value="الطب العام" />
              </div>
              <div class="field">
                <label>البريد الإلكتروني</label>
                <input type="email" value="doctor@clinic.com" />
              </div>
              <div class="field">
                <label>الحالة</label>
                <select>
                  <option>نشط</option>
                  <option>موقوف</option>
                  <option>قيد المراجعة</option>
                </select>
              </div>
              <div class="field full">
                <label>ملاحظات</label>
                <textarea>يعمل على استلام الحالات الروتينية ومتابعة المرضى المزمنين يومياً.</textarea>
              </div>
            </div>

            <div class="form-actions">
              <button type="button" class="ghost-btn">إلغاء</button>
              <button type="button" class="primary-btn">حفظ التعديلات</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>

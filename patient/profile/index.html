<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إدارة الملف الشخصي</title>
    <link rel="stylesheet" href="../assets/patient.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">+</div>
          <div>
            <small>Clinic Portal</small>
            <strong>لوحة المريض</strong>
          </div>
        </div>

        <div class="side-group">
          <div class="side-label">المريض</div>
          <a class="nav-link" href="../index.html"><span>العيادات</span><span class="count">01</span></a>
          <a class="nav-link" href="../bookings/index.html"><span>إدارة الحجوزات الحالية</span><span class="count">02</span></a>
          <a class="nav-link active" href="index.html"><span>إدارة الملف الشخصي</span><span class="count">03</span></a>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p>إدارة الملف الشخصي</p>
            <h1>ملفي الشخصي</h1>
          </div>
          <div class="user-pill">
            <div class="user-avatar">م</div>
            <div>
              <strong>محمد علي</strong>
              <small>مريض</small>
            </div>
            <button type="button" class="logout-button" data-logout>تسجيل الخروج</button>
          </div>
        </header>

        <section class="section-stack">
          <article class="panel">
            <div class="panel-header">
              <h2>بيانات المريض</h2>
              <span class="badge primary">محدث</span>
            </div>

            <div class="profile-summary">
              <div class="profile-avatar">م</div>
              <div class="profile-info">
                <strong>محمد علي</strong>
                <small>رقم الهوية: 1046547865 • العمر: 29 سنة</small>
              </div>
            </div>
          </article>

          <article class="panel">
            <div class="panel-header">
              <h2>الروابط السريعة</h2>
            </div>

            <div class="quick-links">
              <a class="quick-link" href="medical-record.html"><span>السجل الطبي</span><span>→</span></a>
              <a class="quick-link" href="personal-info.html"><span>المعلومات الشخصية</span><span>→</span></a>
              <a class="quick-link" href="previous-visits.html"><span>الزيارات السابقة</span><span>→</span></a>
              <button type="button" class="quick-link logout-button" data-logout><span>تسجيل الخروج</span><span>→</span></button>
            </div>
          </article>
        </section>
      </main>
    </div>
    <script>
      const currentUser = localStorage.getItem('clinic-user');
      if (currentUser !== 'patient') {
        window.location.href = '/login/index.html';
      }

      document.querySelectorAll('[data-logout]').forEach((button) => {
        button.addEventListener('click', () => {
          localStorage.removeItem('clinic-user');
          window.location.href = '/login/index.html';
        });
      });
    </script>
  </body>
</html>
